<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Panadería San Carlos - Iniciar Sesión</title>

    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/umg.css">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="umg-login">
                <img src="img/logo-umg.png" alt="Logo UMG" onerror="this.style.display='none'">
                <strong>Universidad Mariano Gálvez de Guatemala</strong>
                <span>Ingeniería en Sistemas de Información · Desarrollo Web</span>
            </div>

            <div class="logo">
                <h1>Panadería San Carlos</h1>
                <p>Sistema de Gestión</p>
            </div>

            <form id="loginForm">

                <div class="campo">
                    <label for="correo">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="correo"
                        placeholder="Ingrese su correo"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="contrasena">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="contrasena"
                        placeholder="Ingrese su contraseña"
                        required
                    >
                </div>

                <button type="submit">
                    Iniciar sesión
                </button>

                <div id="mensaje"></div>

            </form>

            <p class="umg-login-pie">
                Proyecto Final · Sistema de Control de Producción
            </p>

        </div>

    </div>

    <script src="js/login.js"></script>

</body>
</html>
